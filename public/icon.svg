<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Ambient Glow Circle behind glyph -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" filter="url(#neonGlow)"/>

  <!-- Futuristic AYZEK 'A' Hexagon Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Main A letter structure with apex and crossbar -->
    <path d="M 256 96 L 396 384 L 324 384 L 256 240 L 188 384 L 116 384 Z" fill="url(#accentGrad)" />
    <!-- Center floating triangle negative space -->
    <polygon points="256,168 288,236 224,236" fill="#020617" />
    <!-- Horizontal futuristic core bridge -->
    <rect x="180" y="278" width="152" height="24" rx="12" fill="#22d3ee" />
    <!-- Radiant top jewel dot -->
    <circle cx="256" cy="80" r="14" fill="#38bdf8" />
  </g>
</svg>
